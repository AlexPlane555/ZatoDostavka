<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космическое слияние</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="spaceCanvas"></canvas>
<script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;

    const config = {
        starsCount: 100,
        charsCount: 800, // Немного уменьшим, чтобы не тормозило при проверках
        planetRadius: 160,
        speed: 0.0025,
        pauseDuration: 100,
        chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;:,.<>?"
    };

    let stars = [];
    let planets = [];
    let t = Math.PI / 2;
    let pauseTimer = 0;
    let hasPaused = false;

    const sizeMultiplierLeft = 1.3;
    const sizeMultiplierRight = 0.8;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initStars();
    }
    window.addEventListener('resize', resize);

    function initStars() {
        stars = [];
        for (let i = 0; i < config.starsCount; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.8 + 0.2
            });
        }
    }

    class Planet {
        constructor(colorTheme, sizeMultiplier, id) {
            this.colorTheme = colorTheme;
            this.sizeMultiplier = sizeMultiplier;
            this.id = id; // Идентификатор: 0 - левая, 1 - правая
            this.chars = [];
            this.generateChars();
        }

        generateChars() {
            this.chars = [];
            for (let i = 0; i < config.charsCount; i++) {
                const currentRadius = config.planetRadius * this.sizeMultiplier;
                const r = Math.sqrt(i / config.charsCount) * currentRadius;
                const theta = i * 0.5;
                const noiseR = (Math.random() - 0.5) * 20 * this.sizeMultiplier;
                const noiseTheta = (Math.random() - 0.5) * 0.5;
                const finalR = r + noiseR;
                const finalTheta = theta + noiseTheta;
                const x = Math.cos(finalTheta) * finalR;
                const y = Math.sin(finalTheta) * finalR;

                let color;
                if (this.colorTheme === "blue") {
                    color = `rgba(${Math.floor(Math.random() * 100 + 50)}, ${Math.floor(Math.random() * 100 + 150)}, 255, ${Math.random() * 0.5 + 0.5})`;
                } else {
                    color = `rgba(255, 255, 255, ${Math.random() * 0.6 + 0.4})`;
                }

                this.chars.push({
                    baseX: x,
                    baseY: y,
                    currentX: x,
                    currentY: y,
                    char: config.chars[Math.floor(Math.random() * config.chars.length)],
                    color: color,
                    size: Math.random() * 4 + 10
                });
            }
        }

        // Функция для отталкивания от чужих планет
        resolveCollisions(otherPlanets) {
            // Сначала возвращаем к базовым позициям (чтобы не было накопления ошибки)
            for (let c of this.chars) {
                c.currentX = c.baseX;
                c.currentY = c.baseY;
            }

            // Проходим по всем другим планетам
            for (let other of otherPlanets) {
                if (other.id === this.id) continue; // Пропускаем себя

                // Находим вектор между центрами планет (глобальные координаты)
                const dx = other.centerX - this.centerX;
                const dy = other.centerY - this.centerY;
                const distBetweenCenters = Math.sqrt(dx * dx + dy * dy);
                
                // Если планеты далеко, отталкивание не нужно
                const minDistBetweenCenters = config.planetRadius * (this.sizeMultiplier + other.sizeMultiplier);
                if (distBetweenCenters > minDistBetweenCenters + 20) continue;

                // Если планеты близко, проверяем каждый символ
                for (let c of this.chars) {
                    // Глобальная позиция нашего символа
                    const globalX = this.centerX + c.currentX;
                    const globalY = this.centerY + c.currentY;

                    // Ищем ближайший символ у другой планеты
                    let closestDist = Infinity;
                    let closestChar = null;
                    let closestOtherIndex = -1;

                    for (let i = 0; i < other.chars.length; i++) {
                        const oc = other.chars[i];
                        const ogX = other.centerX + oc.currentX;
                        const ogY = other.centerY + oc.currentY;

                        const dX = globalX - ogX;
                        const dY = globalY - ogY;
                        const d = Math.sqrt(dX * dX + dY * dY);

                        if (d < closestDist) {
                            closestDist = d;
                            closestChar = oc;
                            closestOtherIndex = i;
                        }
                    }

                    // Если символы пересекаются (например, ближе 8 пикселей)
                    if (closestDist < 8) {
                        // Вектор отталкивания (от чужого к нашему)
                        const ogX = other.centerX + closestChar.currentX;
                        const ogY = other.centerY + closestChar.currentY;
                        
                        const pushX = globalX - ogX;
                        const pushY = globalY - ogY;
                        const len = Math.sqrt(pushX * pushX + pushY * pushY) || 1;

                        // Отталкиваем наш символ
                        const force = 5;
                        c.currentX += (pushX / len) * force;
                        c.currentY += (pushY / len) * force;

                        // Отталкиваем чужой символ (чтобы не было одностороннего наложения)
                        closestChar.currentX -= (pushX / len) * force;
                        closestChar.currentY -= (pushY / len) * force;
                    }
                }
            }
        }

        draw(centerX, centerY) {
            this.centerX = centerX;
            this.centerY = centerY;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            
            ctx.font = 'bold 12px "Courier New", Courier, monospace';
            
            for (let i = 0; i < this.chars.length; i++) {
                const c = this.chars[i];
                ctx.fillStyle = c.color;
                ctx.fillText(c.char, c.currentX, c.currentY);
            }
            
            ctx.restore();
        }
    }

    function initPlanets() {
        planets = [
            new Planet("blue", sizeMultiplierLeft, 0),
            new Planet("white", sizeMultiplierRight, 1)
        ];
    }

    function animate() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            
            s.alpha += (Math.random() - 0.5) * 0.05;
            if (s.alpha < 0.1) s.alpha = 0.1;
            if (s.alpha > 1) s.alpha = 1;
        }

        const cx = width / 2;
        const cy = height / 2;

        const sinValue = Math.sin(t);
        const maxDist = width * 0.35;

        const minDist = config.planetRadius * (sizeMultiplierLeft + sizeMultiplierRight) + 10;
        const currentDist = minDist + (maxDist - minDist) * Math.abs(sinValue);

        const leftX = cx + sinValue * currentDist;
        const rightX = cx - sinValue * currentDist;

        const closeness = Math.abs(sinValue);
        
        if (pauseTimer > 0) {
            pauseTimer--;
        } else {
            if (closeness > 0.1) {
                hasPaused = false;
            }

            if (closeness < 0.03 && !hasPaused) {
                pauseTimer = config.pauseDuration;
                hasPaused = true;
            } else {
                t += config.speed;
            }
        }

        // Устанавливаем глобальные позиции перед проверкой столкновений
        planets[0].centerX = leftX;
        planets[0].centerY = cy;
        planets[1].centerX = rightX;
        planets[1].centerY = cy;

        // Разрешаем столкновения между символами
        planets[0].resolveCollisions(planets);
        planets[1].resolveCollisions(planets);

        // Отрисовка
        planets[0].draw(leftX, cy);
        planets[1].draw(rightX, cy);

        if (closeness < 0.15) {
            const intensity = 1 - (closeness / 0.15);
            const centerX = (leftX + rightX) / 2;
            const gradient = ctx.createRadialGradient(centerX, cy, 0, centerX, cy, config.planetRadius * 3);
            gradient.addColorStop(0, `rgba(0, 150, 255, ${intensity * 0.6})`);
            gradient.addColorStop(0.5, `rgba(0, 50, 200, ${intensity * 0.3})`);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, cy, config.planetRadius * 3, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(animate);
    }

    resize();
    initPlanets();
    animate();
</script>
</body>
</html>

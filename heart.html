<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сердце с ровной оболочкой</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
    const LINE_LENGTH = 20;
    const LINE_WIDTH = 0.5;
    const FILL_SPEED = 0.002;
    const SHELL_SPEED = 0.005;
    const TOTAL_FILL_LINES = 2500;
    const TOTAL_EDGE_LINES = 3000; // Увеличено для плотности

    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const bufferCanvas = document.createElement('canvas');
    const bCtx = bufferCanvas.getContext('2d');

    let width, height;
    let scale = 10;
    let particlesData = [];
    let shellData = [];

    const STAGE_FILL = 1;
    const STAGE_SHELL = 2;
    const STAGE_DONE = 3;

    let currentStage = STAGE_FILL;
    let fillProgress = 0;
    let shellProgress = 0;

    function initData() {
        particlesData = [];
        shellData = [];

        // 1. Внутренние линии
        for (let i = 0; i < TOTAL_FILL_LINES; i++) {
            const t = Math.random() * Math.PI * 2;
            const baseX = 16 * Math.pow(Math.sin(t), 3) * scale;
            const baseY = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
            
            const r = Math.random(); 
            const px = baseX * r;
            const py = baseY * r;

            let angle = Math.atan2(py, px);
            const tilt = (Math.random() - 0.5) * (20 * Math.PI / 180);
            angle += tilt;

            const startX = px - Math.cos(angle) * (LINE_LENGTH / 2);
            const startY = py - Math.sin(angle) * (LINE_LENGTH / 2);
            const endX = px + Math.cos(angle) * (LINE_LENGTH / 2);
            const endY = py + Math.sin(angle) * (LINE_LENGTH / 2);

            const cr = 255;
            const cg = Math.floor(Math.random() * 80);
            const cb = Math.floor(Math.random() * 100 + 100);

            particlesData.push({
                startX, startY, endX, endY,
                colorStart: `rgba(${cr},${cg},${cb},0.8)`,
                colorEnd: `rgba(${cr},${cg},${cb},0)`
            });
        }

        // 2. Оболочка (ровная, по нормали)
        for (let i = 0; i < TOTAL_EDGE_LINES; i++) {
            const t = Math.random() * Math.PI * 2;
            
            const x1 = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y1 = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;

            // Вычисляем нормаль
            const t2 = t + 0.01;
            const x2 = 16 * Math.pow(Math.sin(t2), 3) * scale;
            const y2 = -(13 * Math.cos(t2) - 5 * Math.cos(2 * t2) - 2 * Math.cos(3 * t2) - Math.cos(4 * t2)) * scale;
            
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            
            // Строго перпендикуляр (нормаль)
            let angle = Math.atan2(-dx, dy);
            
            // Очень маленький разброс, чтобы не было "идеальной линии"
            const tilt = (Math.random() - 0.5) * (2 * Math.PI / 180);
            angle += tilt;

            const nx = Math.cos(angle) * LINE_LENGTH;
            const ny = Math.sin(angle) * LINE_LENGTH;

            shellData.push({
                startX: x1, startY: y1,
                endX: x1 + nx, endY: y1 + ny,
                colorStart: 'rgba(255, 150, 200, 1)',
                colorEnd: 'rgba(255, 150, 200, 0)'
            });
        }
        
        shellData.sort(() => Math.random() - 0.5);
    }

    function drawGradientLine(context, x1, y1, x2, y2, colorStart, colorEnd) {
        const gradient = context.createLinearGradient(x1, y1, x2, y2);
        gradient.addColorStop(0, colorStart);
        gradient.addColorStop(1, colorEnd);
        
        context.strokeStyle = gradient;
        context.lineWidth = LINE_WIDTH;
        context.beginPath();
        context.moveTo(x1, y1);
        context.lineTo(x2, y2);
        context.stroke();
    }

    function calculateScale() {
        const heartWidthBase = 32; 
        const heartHeightBase = 34;
        const padding = LINE_LENGTH + 20; 
        
        const availableWidth = width - padding * 2;
        const availableHeight = height - padding * 2;
        
        const scaleX = availableWidth / heartWidthBase;
        const scaleY = availableHeight / heartHeightBase;
        
        return Math.min(scaleX, scaleY, 25); 
    }

    function reset() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        bufferCanvas.width = width;
        bufferCanvas.height = height;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        bCtx.setTransform(1, 0, 0, 1, 0, 0);
        
        ctx.translate(width / 2, height / 2);
        bCtx.translate(width / 2, height / 2);

        scale = calculateScale();
        
        currentStage = STAGE_FILL;
        fillProgress = 0;
        shellProgress = 0;
        
        bCtx.clearRect(-width / 2, -height / 2, width, height);
        
        initData();
    }
    window.addEventListener('resize', reset);

    function animate() {
        if (!particlesData || particlesData.length === 0) {
            requestAnimationFrame(animate);
            return;
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(-width / 2, -height / 2, width, height);

        if (currentStage === STAGE_FILL) {
            fillProgress += FILL_SPEED;
            let linesToDraw = Math.floor(fillProgress * particlesData.length);
            if (linesToDraw > particlesData.length) linesToDraw = particlesData.length;
            
            for (let i = 0; i < linesToDraw; i++) {
                const p = particlesData[i];
                if (p) {
                    drawGradientLine(bCtx, p.startX, p.startY, p.endX, p.endY, p.colorStart, p.colorEnd);
                }
            }

            if (fillProgress >= 1) {
                currentStage = STAGE_SHELL;
            }
        }
        
        else if (currentStage === STAGE_SHELL) {
            shellProgress += SHELL_SPEED;
            let shellToDraw = Math.floor(shellProgress * shellData.length);
            if (shellToDraw > shellData.length) shellToDraw = shellData.length;

            for (let i = 0; i < shellToDraw; i++) {
                const s = shellData[i];
                if (s) {
                    drawGradientLine(bCtx, s.startX, s.startY, s.endX, s.endY, s.colorStart, s.colorEnd);
                }
            }

            if (shellProgress >= 1) {
                currentStage = STAGE_DONE;
            }
        }

        ctx.drawImage(bufferCanvas, -width / 2, -height / 2);

        requestAnimationFrame(animate);
    }

    reset();
    animate();
</script>
</body>
</html>
